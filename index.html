<!DOCTYPE html>
<html>
<head>
  <title>EditX Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

    body{
      color:white;
      background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
      background-size:400% 400%;
      animation:bg 10s ease infinite;
      text-align:center;
    }

    @keyframes bg{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    header{
      padding:20px;
      background:rgba(0,0,0,0.6);
      position:sticky;
      top:0;
      backdrop-filter:blur(10px);
    }

    h1{
      font-size:40px;
      color:#22c55e;
    }

    section{
      padding:50px 20px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      padding:20px;
      margin:15px auto;
      max-width:420px;
      border-radius:15px;
      box-shadow:0 0 15px black;
    }

    input,textarea{
      width:90%;
      padding:10px;
      margin:5px;
      border:none;
      border-radius:8px;
    }

    button{
      padding:12px 22px;
      background:#22c55e;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
      background:#16a34a;
    }

    .price{
      font-size:22px;
      color:#facc15;
    }

    footer{
      padding:20px;
      background:rgba(0,0,0,0.5);
    }

  </style>
</head>

<body>

<header>
  <h1>EditX Studio</h1>
  <p>🔥 Edit Like Pro & Earn Money Online</p>
</header>

<section>
  <div class="card">
    <h2>💰 Premium Editing Pack</h2>
    <p>Presets + Templates + Effects</p>
    <p class="price">Rs. 300</p>
  </div>
</section>

<section>
  <h2>📦 Order System</h2>

  <div class="card">

    <input type="text" id="name" placeholder="Your Name">
    <input type="text" id="phone" placeholder="WhatsApp Number">
    <textarea id="msg" placeholder="What do you need?"></textarea>

    <button onclick="order()">Place Order</button>

  </div>
</section>

<section>
  <h2>📞 Direct Contact</h2>
  <a href="https://wa.me/923XXXXXXXXX">
    <button>WhatsApp Us</button>
  </a>
</section>

<footer>
  <p>© 2026 EditX Studio | Built for Creators 😎</p>
</footer>

<script>
function order(){

  let id = Math.floor(Math.random()*99999);

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let msg = document.getElementById("msg").value;

  let text =
  "🧾 NEW ORDER #%23" + id + "%0A%0A" +
  "Name: " + name + "%0A" +
  "Phone: " + phone + "%0A" +
  "Request: " + msg + "%0A%0A" +
  "From EditX Studio";

  window.open("https://wa.me/923XXXXXXXXX?text=" + text);
}
</script>

</body>
  </html>
