<!DOCTYPE html>
<html>
<head>
  <title>EditX Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family:Arial;text-align:center;background:#0f172a;color:white;">

<h1>🔥 EditX Studio Login</h1>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 Firebase Config (tumhara already wala)
const firebaseConfig = {
  apiKey: "AIzaSyAoF3HH4JTmUJiFPZ7WANyL4LTu7KdkBY4",
  authDomain: "editxstudio-d43df.firebaseapp.com",
  projectId: "editxstudio-d43df",
  storageBucket: "editxstudio-d43df.firebasestorage.app",
  messagingSenderId: "255158472919",
  appId: "1:255158472919:web:d4cde7d834a15954272092"
};

// Init Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SIGN UP
window.signup = function(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, pass)
  .then(() => {
    document.getElementById("msg").innerText = "Account Created ✅";
  })
  .catch((error) => {
    document.getElementById("msg").innerText = error.message;
  });
}

// LOGIN
window.login = function(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, pass)
  .then(() => {
    document.getElementById("msg").innerText = "Login Successful 🚀";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);

  })
  .catch((error) => {
    document.getElementById("msg").innerText = error.message;
  });
}

</script>

</body>
</html>
